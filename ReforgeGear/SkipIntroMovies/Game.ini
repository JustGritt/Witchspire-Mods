; ============================================================================
;  Witchspire - Skip Intro Movies
;
;  Clears Unreal's startup movies (the UE4 logo, the Envar studio logo, and the
;  Witchspire startup-loading video) so the game boots straight to the main
;  menu. These movies are played by the engine's MoviePlayer at launch, BEFORE
;  the AngelScript mods load -- which is why this is a config override and not a
;  .as script mod.
;
;  This lives in the game's USER config layer (Hercules/Saved/Config/Windows),
;  which is applied LAST in Unreal's config hierarchy and therefore overrides
;  the packaged DefaultGame.ini.
;
;    !StartupMovies=ClearArray  -> empties the startup-movie list the game set.
;    bWaitForMoviesToComplete   -> don't block boot waiting on a movie.
;    bMoviesAreSkippable        -> any residual movie can be clicked through.
;
;  To revert: run  scripts/skip-intro.ps1 -Revert  (or just delete this file).
; ============================================================================
[/Script/MoviePlayer.MoviePlayerSettings]
bWaitForMoviesToComplete=False
bMoviesAreSkippable=True
!StartupMovies=ClearArray
